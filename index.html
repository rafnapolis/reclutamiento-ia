<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reclutamiento Inteligente con IA | Manual Gratuito para RRHH</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1e293b;
      background-color: #0f172a;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
    }
    .landing-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(10px);
    }
    .badge {
      display: inline-block;
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border: 1px solid rgba(192, 132, 252, 0.3);
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 34px;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 15px;
    }
    h1 span { color: #a78bfa; }
    p.subtitle {
      font-size: 15.5px;
      color: #94a3b8;
      margin-bottom: 30px;
    }
    .action-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
    }
    .btn-download {
      background: #4f46e5;
      color: white;
      padding: 16px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-download:hover {
      background: #4338ca;
      transform: translateY(-2px);
    }
    .btn-payhip {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-payhip:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
    .features-mini {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid rgba(51, 65, 85, 0.6);
      padding-top: 20px;
      font-size: 13px;
      color: #94a3b8;
      gap: 10px;
    }
    .features-mini div {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    @media (max-width: 480px) {
      h1 { font-size: 26px; }
      .landing-card { padding: 25px 20px; }
      .features-mini { flex-direction: column; gap: 8px; text-align: left; }
    }
  </style>
</head>
<body>

  <div class="landing-card">
    <span class="badge">MANUAL TÉCNICO B2B</span>
    
    <h1>Reclutamiento Inteligente con <span>Agentes de IA</span></h1>
    
    <p class="subtitle">
      Descarga el manual operativo y reduce un 70% el tiempo de filtrado de currículums en tu departamento.
    </p>

    <div class="action-container">
      <!-- Botón único y directo de descarga del PDF (sin formularios) -->
      <a href="ebook_rrhh_ia_final.pdf" class="btn-download" download>
        <i class="fa-solid fa-file-arrow-down"></i> Descargar Ebook Gratis (PDF)
      </a>

      <!-- Acceso directo opcional hacia el kit completo en Payhip -->
      <a href="https://payhip.com/b/Ootfq" target="_blank" class="btn-payhip">
        <i class="fa-solid fa-bolt text-amber-400"></i> Ver Kit de Plantillas Make (.JSON)
      </a>
    </div>

    <div class="features-mini">
      <div><i class="fa-solid fa-check text-green-400"></i> Sin registros</div>
      <div><i class="fa-solid fa-check text-indigo-400"></i> Acceso inmediato</div>
      <div><i class="fa-solid fa-check text-purple-400"></i> 100% Práctico</div>
    </div>
  </div>

</body>
</html>
